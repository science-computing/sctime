<!-- this file was in most parts generated by qt 6.8. But it uses a split wasm archive to increase probability of caching.
 You can either use the autogenerated html from the build, or split
 your wasm file and use this modified html. To split the wasm run for example in a unix shell
 split -d -b 8192k sctime.wasm sctime.wasm.part
 -->

<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>sctime</title>
    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }
    </style>
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img id="qtlogo" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: sctime</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">

        function concatBuf (arraybuffers) {
            let length = 0
            for (const b of arraybuffers)
                length += b.byteLength
          
            let resultbuf = new ArrayBuffer(length)
            let resultuint8 = new Uint8Array(resultbuf)
            let offset = 0
            for (const b of arraybuffers) {
                const partuint8 = new Uint8Array(b)
                resultuint8.set(partuint8, offset)
                offset += partuint8.byteLength
            }
        
            return resultbuf
        }

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))

        const CACHE_NAME = "sctime-wasm-v1"

        // Cache Storage is only available in secure contexts; without it we fall back to the HTTP cache.
        async function openPartCache() {
            if (!window.caches)
                return null
            try {
                return await caches.open(CACHE_NAME)
            } catch (e) {
                console.warn("Cache Storage unavailable:", e)
                return null
            }
        }

        // Returns the part's bytes, or null if the part does not exist (HTTP 404).
        // Any other failure (network error, 5xx, truncated body) throws.
        // Parts kept in Cache Storage are revalidated with a conditional request (a cheap 304), so a
        // part that changed under the same URL is never served stale. If the network is unreachable,
        // the stored copy is used.
        async function fetchPart(partUrl, cache, forceReload) {
            let cached = null
            if (cache && !forceReload) {
                try {
                    cached = await cache.match(partUrl)
                } catch (e) {
                    console.warn("Cache lookup failed for " + partUrl + ":", e)
                }
            }
            const headers = new Headers()
            if (cached) {
                const etag = cached.headers.get("ETag")
                const lastModified = cached.headers.get("Last-Modified")
                if (etag)
                    headers.set("If-None-Match", etag)
                if (lastModified)
                    headers.set("If-Modified-Since", lastModified)
            }
            // With Cache Storage the HTTP cache is bypassed to avoid storing every part twice
            const cacheMode = cache ? "no-store" : (forceReload ? "reload" : "default")
            let resp
            try {
                resp = await fetch(partUrl, {headers, cache: cacheMode})
            } catch (e) {
                if (cached) {
                    console.warn("Network unavailable, using stored copy of " + partUrl)
                    return await cached.arrayBuffer()
                }
                throw e
            }
            if (resp.status === 304 && cached)
                return await cached.arrayBuffer()
            if (resp.status === 404) {
                if (cache)
                    await cache.delete(partUrl).catch(() => {})
                return null
            }
            // A login page (redirect or HTML) or an error status must neither be used nor stored;
            // a previously stored copy is still good (the version is part of the URL).
            const badResponse = !resp.ok ? "HTTP " + resp.status
                : (resp.redirected || (resp.headers.get("Content-Type") || "").startsWith("text/html")) ? "unexpected response (login page?)"
                : null
            if (badResponse) {
                if (cached) {
                    console.warn("Got " + badResponse + " for " + partUrl + ", using stored copy")
                    return await cached.arrayBuffer()
                }
                throw new Error(badResponse + " for " + partUrl)
            }
            const buf = await resp.arrayBuffer()
            // Content-Length is only comparable to the body size if no content encoding is applied
            const expected = resp.headers.get("Content-Length")
            if (expected !== null && !resp.headers.get("Content-Encoding") && buf.byteLength !== Number(expected))
                throw new Error("Incomplete download of " + partUrl + ": got " + buf.byteLength + " of " + expected + " bytes")
            if (cache) {
                const etag = resp.headers.get("ETag")
                const lastModified = resp.headers.get("Last-Modified")
                // Without a validator the entry could not be revalidated later
                if (etag || lastModified) {
                    const storedHeaders = new Headers()
                    if (etag)
                        storedHeaders.set("ETag", etag)
                    if (lastModified)
                        storedHeaders.set("Last-Modified", lastModified)
                    try {
                        await cache.put(partUrl, new Response(buf.slice(0), {headers: storedHeaders}))
                    } catch (e) {
                        console.warn("Could not store " + partUrl + " in Cache Storage:", e)
                    }
                }
            }
            return buf
        }

        async function fetchPartWithRetry(partUrl, cache, forceReload) {
            const MAX_TRIES = 4
            for (let attempt = 0; ; attempt++) {
                try {
                    return await fetchPart(partUrl, cache, forceReload || attempt > 0)
                } catch (e) {
                    if (attempt + 1 >= MAX_TRIES)
                        throw e
                    console.warn("Retrying " + partUrl + ":", e)
                    await sleep(500 * Math.pow(2, attempt))
                }
            }
        }

        async function loadFromParts(url, statusElement, forceReload) {
            let NUM_PARTS=99
            const arr = []
            const cache = await openPartCache()
            for (let idx = 0; idx < NUM_PARTS; idx++) {
                const part = await fetchPartWithRetry(url + ".part" + String(idx).padStart(2, '0'), cache, forceReload)
                if (part === null)
                    break
                arr.push(part)
                statusElement.innerHTML += "."
            }
            if (arr.length === 0)
                throw new Error("No parts of " + url + " found")
            // all parts but the last have the size of the first one (see split command above)
            const partSize = arr[0].byteLength
            arr.forEach((p, i) => {
                if (i < arr.length - 1 ? p.byteLength !== partSize : p.byteLength > partSize)
                    throw new Error("Part " + i + " of " + url + " has unexpected size " + p.byteLength)
            })
            if (cache)
                await removeStaleParts(cache, url, arr.length)
            return concatBuf(arr)
        }

        // Small files needed to start the app; stored like the wasm parts so they work offline / when logged out
        const ASSETS = ["sctime.js", "qtloader.js", "qtlogo.svg"]

        async function fetchAsset(url) {
            const buf = await fetchPartWithRetry(url, await openPartCache(), false)
            if (buf === null)
                throw new Error("Could not load " + url)
            return buf
        }

        // Inline injection keeps document.currentScript.src empty, so emscripten resolves
        // relative file names against the page just as with <script src>.
        async function loadScript(url) {
            const script = document.createElement("script")
            script.textContent = new TextDecoder().decode(await fetchAsset(url))
            document.head.appendChild(script)
        }

        // Drops every stored entry that is not part of the current version. Deploys put the version in the
        // URL path, so entries of older versions live under different URLs and must be removed as well.
        async function removeStaleParts(cache, url, numParts) {
            try {
                const keep = new Set(ASSETS.map(a => new URL(a, location.href).href))
                for (let idx = 0; idx < numParts; idx++)
                    keep.add(new URL(url + ".part" + String(idx).padStart(2, '0'), location.href).href)
                for (const req of await cache.keys()) {
                    if (!keep.has(req.url))
                        await cache.delete(req)
                }
            } catch (e) {
                console.warn("Cache cleanup failed:", e)
            }
        }

        // Downloads and compiles the wasm module. Retries the whole download bypassing the
        // HTTP cache if the result is incomplete or corrupt (e.g. flaky network, broken cache entry).
        async function loadWasm(url, statusElement) {
            const MAX_TRIES = 3
            // Ask for exemption from automatic eviction; the browser may silently decline
            if (navigator.storage && navigator.storage.persist)
                navigator.storage.persist().catch(() => {})
            for (let attempt = 0; ; attempt++) {
                try {
                    const ab = await loadFromParts(url, statusElement, attempt > 0)
                    return await WebAssembly.compile(ab)
                } catch (e) {
                    if (attempt + 1 >= MAX_TRIES)
                        throw e
                    console.warn("Loading " + url + " failed, retrying:", e)
                    statusElement.innerHTML = "Loading failed, retrying..."
                    await sleep(1000 * (attempt + 1))
                }
            }
        }

        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                fetchAsset("qtlogo.svg")
                    .then(buf => document.querySelector('#qtlogo').src =
                        URL.createObjectURL(new Blob([buf], {type: "image/svg+xml"})))
                    .catch(e => console.warn("Could not load logo:", e))
                await loadScript("sctime.js")
                await loadScript("qtloader.js")

                const wasmPromise = Promise.resolve(await loadWasm("sctime.wasm", status))

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => showUi(screen),
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.sctime_entry,
                        containerElements: [screen],
                        module: wasmPromise,
                        environment : {},
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
                status.innerHTML = 'Loading failed (' + e.message + '). Please check your network connection and reload the page.';
            }
        }
    </script>
  </body>
</html>
