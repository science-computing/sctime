<!-- this file was in most parts generated by qt 6.8. But it uses a split wasm archive to increase probability of caching.
 You can either use the autogenerated html from the build, or split
 your wasm file and use this modified html. To split the wasm run for example in a unix shell
 split -d -b 8192k sctime.wasm sctime.wasm.part
 -->

<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>sctime</title>
    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }
    </style>
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: sctime</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">

        function concatBuf (arraybuffers) {
            let length = 0
            for (const b of arraybuffers)
                length += b.byteLength
          
            let resultbuf = new ArrayBuffer(length)
            let resultuint8 = new Uint8Array(resultbuf)
            let offset = 0
            for (const b of arraybuffers) {
                const partuint8 = new Uint8Array(b)
                resultuint8.set(partuint8, offset)
                offset += partuint8.byteLength
            }
        
            return resultbuf
        }

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))

        // Returns the part's bytes, or null if the part does not exist (HTTP 404).
        // Any other failure (network error, 5xx, truncated body) throws.
        async function fetchPart(partUrl, cacheMode) {
            const resp = await fetch(partUrl, {cache: cacheMode})
            if (resp.status === 404)
                return null
            if (!resp.ok)
                throw new Error("HTTP " + resp.status + " for " + partUrl)
            const buf = await resp.arrayBuffer()
            // Content-Length is only comparable to the body size if no content encoding is applied
            const expected = resp.headers.get("Content-Length")
            if (expected !== null && !resp.headers.get("Content-Encoding") && buf.byteLength !== Number(expected))
                throw new Error("Incomplete download of " + partUrl + ": got " + buf.byteLength + " of " + expected + " bytes")
            return buf
        }

        async function fetchPartWithRetry(partUrl, forceReload) {
            const MAX_TRIES = 4
            for (let attempt = 0; ; attempt++) {
                try {
                    return await fetchPart(partUrl, (forceReload || attempt > 0) ? "reload" : "default")
                } catch (e) {
                    if (attempt + 1 >= MAX_TRIES)
                        throw e
                    console.warn("Retrying " + partUrl + ":", e)
                    await sleep(500 * Math.pow(2, attempt))
                }
            }
        }

        async function loadFromParts(url, statusElement, forceReload) {
            let NUM_PARTS=99
            const arr = []
            for (let idx = 0; idx < NUM_PARTS; idx++) {
                const part = await fetchPartWithRetry(url + ".part" + String(idx).padStart(2, '0'), forceReload)
                if (part === null)
                    break
                arr.push(part)
                statusElement.innerHTML += "."
            }
            if (arr.length === 0)
                throw new Error("No parts of " + url + " found")
            // all parts but the last have the size of the first one (see split command above)
            const partSize = arr[0].byteLength
            arr.forEach((p, i) => {
                if (i < arr.length - 1 ? p.byteLength !== partSize : p.byteLength > partSize)
                    throw new Error("Part " + i + " of " + url + " has unexpected size " + p.byteLength)
            })
            return concatBuf(arr)
        }

        // Downloads and compiles the wasm module. Retries the whole download bypassing the
        // HTTP cache if the result is incomplete or corrupt (e.g. flaky network, broken cache entry).
        async function loadWasm(url, statusElement) {
            const MAX_TRIES = 3
            for (let attempt = 0; ; attempt++) {
                try {
                    const ab = await loadFromParts(url, statusElement, attempt > 0)
                    return await WebAssembly.compile(ab)
                } catch (e) {
                    if (attempt + 1 >= MAX_TRIES)
                        throw e
                    console.warn("Loading " + url + " failed, retrying:", e)
                    statusElement.innerHTML = "Loading failed, retrying..."
                    await sleep(1000 * (attempt + 1))
                }
            }
        }

        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const wasmPromise = Promise.resolve(await loadWasm("sctime.wasm", status))

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => showUi(screen),
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.sctime_entry,
                        containerElements: [screen],
                        module: wasmPromise,
                        environment : {},
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
                status.innerHTML = 'Loading failed (' + e.message + '). Please check your network connection and reload the page.';
            }
        }
    </script>
    <script src="sctime.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
